name: ci

on:
  push:
  pull_request:

jobs:
  fake-booking:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fake-booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==25.0.1
      - name: Install
        run: |
          pip install --disable-pip-version-check --require-hashes -r constraints-dev.txt
          pip install --disable-pip-version-check --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  fake-pvs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fake-pvs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==25.0.1
      - name: Install
        run: |
          pip install --disable-pip-version-check --require-hashes -r constraints-dev.txt
          pip install --disable-pip-version-check --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  chaos-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaos-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==25.0.1
      - name: Install
        run: |
          pip install --disable-pip-version-check --require-hashes -r constraints-dev.txt
          pip install --disable-pip-version-check --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  scenario-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scenario-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==25.0.1
      - name: Install
        run: |
          pip install --disable-pip-version-check --require-hashes -r constraints-dev.txt
          pip install --disable-pip-version-check --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  contract-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==25.0.1
      - name: Install
        run: |
          pip install --disable-pip-version-check --require-hashes -r constraints-dev.txt
          pip install --disable-pip-version-check --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  external-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==25.0.1
      - name: Install
        run: |
          pip install --disable-pip-version-check --require-hashes -r constraints-dev.txt
          pip install --disable-pip-version-check --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  lock-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
      - name: Validate committed locks and Python base pin
        run: python3 scripts/validate_locks.py

  container-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - fake-booking-tests
          - fake-pvs-tests
          - chaos-proxy-tests
          - scenario-runner-tests
          - contract-check-tests
          - external-client-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run documented containerized unit-test target
        run: docker compose --profile test run --rm --build ${{ matrix.service }}

  image-build-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - fake-booking
          - fake-pvs
          - chaos-proxy
          - scenario-runner
          - contract-check
          - external-client
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build test target
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target test \
            --load \
            -t praxis-forge/${{ matrix.component }}:test-${{ matrix.arch }} \
            ./${{ matrix.component }}
      - name: Verify installed versions against the committed lock
        run: |
          python3 scripts/verify_installed_versions.py \
            --skip-build \
            --target test \
            --platform ${{ matrix.platform }} \
            --image praxis-forge/${{ matrix.component }}:test-${{ matrix.arch }} \
            ${{ matrix.component }}
      - name: Report architecture coverage
        run: |
          echo "built=${{ matrix.component }} test target on ${{ matrix.platform }}"
          echo "executed=pip freeze comparison on ${{ matrix.platform }}"
          echo "pytest_on_this_job=no"
          echo "pytest_runs_in=container-unit-tests on ubuntu-latest linux/amd64"

  contract-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run contract gate against Compose simulator containers
        run: docker compose --profile contract run --rm --build contract-check

  scenario-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run named scenarios against Compose services
        run: docker compose --profile scenario run --rm --build scenario-runner

  transport-chaos-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run transport-chaos scenarios against Compose services
        run: docker compose --profile scenario run --rm --build scenario-runner-transport

  soak-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded soak against Compose services
        run: |
          mkdir -p artifacts
          docker compose --profile scenario run --rm --build scenario-runner-soak
      - name: Validate soak evidence artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/soak.json").read_text(encoding="utf-8"))
          required = (
              "schema",
              "status",
              "mode",
              "suites",
              "requested_iterations",
              "completed_iterations",
              "replay_selector",
              "iterations",
              "first_failure",
          )
          missing = [key for key in required if key not in payload]
          if missing:
              raise SystemExit(f"evidence missing keys: {missing}")
          if payload["schema"] != "praxis-forge.soak-evidence.v1":
              raise SystemExit(f"unexpected schema: {payload['schema']!r}")
          if payload["status"] != "pass" or payload["mode"] != "soak":
              raise SystemExit(payload)
          if payload["requested_iterations"] != 2 or payload["completed_iterations"] != 2:
              raise SystemExit(payload)
          if payload["suites"] != ["semantic", "transport-chaos"]:
              raise SystemExit(f"unexpected suites: {payload['suites']!r}")
          selectors = [item["replay_selector"] for item in payload["iterations"]]
          if selectors != [
              "semantic:1",
              "transport-chaos:1",
              "semantic:2",
              "transport-chaos:2",
          ]:
              raise SystemExit(f"unexpected selectors: {selectors!r}")
          for item in payload["iterations"]:
              if item["status"] != "pass" or not item["scenarios"]:
                  raise SystemExit(item)
              for scenario in item["scenarios"]:
                  if scenario["status"] != "pass" or "name" not in scenario or "ids" not in scenario:
                      raise SystemExit(scenario)
          print("soak evidence ok")
          PY

  restart-recovery-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host-side restart-recovery gate against Compose containers
        run: python3 scripts/restart_recovery.py

  crash-consistency-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==25.0.1
      - name: Install simulator packages for failpoint gate
        run: |
          pip install --disable-pip-version-check --require-hashes -r ./fake-booking/constraints.txt
          pip install --disable-pip-version-check --no-deps -e "./fake-booking"
          pip install --disable-pip-version-check --require-hashes -r ./fake-pvs/constraints.txt
          pip install --disable-pip-version-check --no-deps -e "./fake-pvs"
      - name: Run host-side crash-consistency failpoint gate
        run: python3 scripts/crash_consistency.py

  cross-compose-lab-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cross-Compose lab gate with two project names
        run: python3 scripts/cross_compose_lab.py
