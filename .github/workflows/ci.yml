name: ci

on:
  push:
  pull_request:

jobs:
  fake-booking:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fake-booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
